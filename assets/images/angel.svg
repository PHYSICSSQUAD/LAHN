    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#dcefe6"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe89b"/><stop offset="1" stop-color="#e5b44f"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#ffdfc3"/><stop offset="1" stop-color="#e9ae87"/></linearGradient>
    <linearGradient id="book" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#91d2bd"/><stop offset="1" stop-color="#58a990"/></linearGradient>
    <filter id="shadow" x="-30%" y="-25%" width="160%" height="170%"><feDropShadow dx="0" dy="13" stdDeviation="12" flood-color="#66786c" flood-opacity=".16"/></filter>

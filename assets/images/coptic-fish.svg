      <path d="M158 279c39 43 89 69 150 77" fill="none" stroke="#b84e34" stroke-width="7" opacity=".24" stroke-linecap="round"/>
    </g>
    <!-- face -->
    <ellipse cx="452" cy="181" rx="27" ry="34" fill="#fffdf5" stroke="#d9d8c8" stroke-width="5"/>
    <ellipse cx="459" cy="185" rx="14" ry="20" fill="#3d5b61"/>
    <ellipse cx="463" cy="178" rx="6" ry="8" fill="#fff"/>
    <path d="M482 226q18 15 35 0" fill="none" stroke="#9e4937" stroke-width="7" stroke-linecap="round"/>
    <path d="M402 149q18-14 35-8" fill="none" stroke="#b65d3e" stroke-width="6" stroke-linecap="round"/>
    <path d="M277 157c19 22 27 48 24 78" fill="none" stroke="#d6673d" stroke-width="6" stroke-linecap="round" opacity=".78"/>
    <circle cx="426" cy="221" r="8" fill="#f07d67" opacity=".5"/>

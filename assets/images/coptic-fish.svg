  <path d="m520 86 6 13 14 5-14 6-6 14-5-14-14-6 14-5 5-13Z" fill="#f3c65d"/>
  <circle cx="105" cy="110" r="7" fill="#80ccba"/><circle cx="80" cy="294" r="5" fill="#f09a7d"/>

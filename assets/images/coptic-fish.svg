      <path d="M202 73c34 69 39 204 1 281l46 8c43-83 39-219 0-293l-47 4Z" fill="url(#stripe)" stroke="#536b67" stroke-width="8"/>
      <path d="M345 78c31 66 37 195 3 264l47-1c39-77 34-191-1-255l-49-8Z" fill="url(#stripe)" stroke="#536b67" stroke-width="8"/>

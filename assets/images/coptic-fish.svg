    <path d="M320 204c-5-40 17-72 51-84 12 33 34 53 65 66-28 15-67 22-116 18Z" fill="#ef9b55" stroke="#d36d3f" stroke-width="6"/>
    <path d="M320 219c-5 40 17 72 51 84 12-33 34-53 65-66-28-15-67-22-116-18Z" fill="#ef9b55" stroke="#d36d3f" stroke-width="6"/>

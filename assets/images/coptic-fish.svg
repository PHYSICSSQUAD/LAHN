    <path d="M155 211c-43-55-92-83-125-70 13 40 13 100 0 140 34 15 83-14 125-70Z" fill="url(#fin)" stroke="#418e80" stroke-width="7" stroke-linejoin="round"/>
    <path d="M270 113c27-55 68-83 103-69-8 37 3 69 26 98-40 9-86 2-129-29Z" fill="url(#fin)" stroke="#418e80" stroke-width="7" stroke-linejoin="round"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="title desc">
  <title id="title">سمكة قبطية مرحة</title>
  <desc id="desc">سمكة برتقالية وبيضاء تسبح في الماء</desc>
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#ffc36c"/><stop offset=".47" stop-color="#fa8847"/><stop offset="1" stop-color="#e86639"/></linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9adcc9"/><stop offset="1" stop-color="#48a997"/></linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffef4"/><stop offset="1" stop-color="#e8f1e6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#48685e" flood-opacity=".18"/></filter>
    <clipPath id="bodyClip"><path d="M126 211c37-91 133-137 246-122 76 10 127 49 172 122-45 73-96 112-172 122-113 15-209-31-246-122Z"/></clipPath>
  </defs>
  <ellipse cx="304" cy="354" rx="190" ry="18" fill="#75b8a9" opacity=".13"/>
